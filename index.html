      // ═══════════════════════════════════════════════════════════════════
      // MIC — request permission ONCE on page load, reuse instance
      // ═══════════════════════════════════════════════════════════════════
      let chatRecog = null,
        chatListening = false;
      let talkRecog = null,
        talkActive = false,
        talkMuted = false,
        spkOn = true;
      let isSpeaking = false,
        isListening = false;
      let talkHistory = [],
        talkTimerInt = null,
        talkSecs = 0;
      let micPermGranted = false;

      // Request mic permission once at startup — after first user interaction
      async function requestMicOnce() {
        if (micPermGranted) return true;
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          console.warn("SpeechRecognition not supported");
          return false;
        }
        if (location.protocol === "file:") {
          // Can never get persistent mic from file:// — warn and return false
          return false;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          stream.getTracks().forEach((t) => t.stop());
          micPermGranted = true;
          if (!chatRecog) initChatRecog();
          if (!talkRecog) initTalkRecog();
          return true;
        } catch (e) {
          console.warn("Mic permission denied:", e);
          return false;
        }
      }

      function initChatRecog() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR || chatRecog) return;
        chatRecog = new SR();
        chatRecog.lang = l("sttLang");
        chatRecog.interimResults = true;
        chatRecog.continuous = false;
        chatRecog._listening = false;
        chatRecog.onstart = () => {
          chatListening = true;
          micBtnEl.classList.add("on");
        };
        chatRecog.onresult = (e) => {
          inp.value = Array.from(e.results)
            .map((r) => r[0].transcript)
            .join("");
        };
        chatRecog.onend = () => {
          chatListening = false;
          micBtnEl.classList.remove("on");
          const tx = inp.value.trim();
          if (tx && !inp.disabled)
            setTimeout(() => {
              inp.value = "";
              handleInput(tx);
            }, 300);
        };
        chatRecog.onerror = (e) => {
          chatListening = false;
          micBtnEl.classList.remove("on");
        };
      }

      // ── Listen-then-process engine ───────────────────────────────────
      // Flow: talkSpeak(text) → afterTalkSpeak() → listenForResponse()
      // listenForResponse opens mic for up to 8s, waits for speech,
      // if nothing heard retries up to 2 times then prompts again.

      let _listenRetries = 0;
      let _waitingForRepeat = false;
      const MAX_RETRIES = 1; // 1 silent retry then prompt

      function initTalkRecog() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR || talkRecog) return;

        talkRecog = new SR();
        talkRecog.lang = l("sttLang");
        talkRecog.interimResults = true;
        talkRecog.continuous = false; // one utterance at a time
        talkRecog.maxAlternatives = 1;
        talkRecog._captured = "";
        talkRecog._silenceTimer = null;

        talkRecog.onstart = () => {
          isListening = true;
          showWave(true, true);
          talkStEl.textContent = lang === "it" ? "Ascolto..." : "Listening...";
          talkStEl.className = "talk-st listening";
          talkRecog._captured = "";

          // Safety timeout — if browser never fires onend, force it after 10s
          talkRecog._silenceTimer = setTimeout(() => {
            if (isListening) {
              try {
                talkRecog.stop();
              } catch (e) {}
            }
          }, 10000);
        };

        talkRecog.onresult = (e) => {
          const txt = Array.from(e.results)
            .map((r) => r[0].transcript)
            .join("");
          const isFinal = e.results[e.results.length - 1].isFinal;
          if (isFinal) {
            talkRecog._captured = txt;
            talkStEl.textContent = `"${txt.substring(0, 45)}"`;
            // Got final result — stop immediately, don't wait for silence
            clearTimeout(talkRecog._silenceTimer);
            try {
              talkRecog.stop();
            } catch (e) {}
          } else {
            // Show live interim
            talkStEl.textContent = `${lang === "it" ? "Sento" : "Hearing"}: ${txt.substring(0, 40)}`;
          }
        };

        talkRecog.onend = () => {
          clearTimeout(talkRecog._silenceTimer);
          isListening = false;
          showWave(false);
          if (!talkActive) return;

          const heard = (talkRecog._captured || "").trim();
          talkRecog._captured = "";

          if (heard) {
            // Got speech — reset retry counter and process
            _listenRetries = 0;
            addTalkLine("user", heard);
            processTalkTurn(heard);
          } else {
            // Nothing heard in this window
            _listenRetries++;
            if (_listenRetries < MAX_RETRIES) {
              // Silently retry — just reopen mic
              talkStEl.textContent =
                lang === "it" ? "Ascolto..." : "Listening...";
              talkStEl.className = "talk-st listening";
              setTimeout(() => {
                if (talkActive && !talkMuted && !isSpeaking) startTalkListen();
              }, 800);
            } else {
              // Max retries hit — ask once, then reset and wait
              _listenRetries = 0;
              const prompt =
                lang === "it"
                  ? "Non ti sento. Parla più vicino al microfono."
                  : "I cannot hear you. Please speak closer to the microphone.";
              addTalkLine("bot", prompt);
              // Speak prompt but use a flag so afterTalkSpeak knows to NOT auto-retry infinitely
              _waitingForRepeat = true;
              talkSpeak(prompt);
            }
          }
        };

        talkRecog.onerror = (e) => {
          clearTimeout(talkRecog._silenceTimer);
          isListening = false;
          showWave(false);
          talkRecog._captured = "";

          if (e.error === "not-allowed") {
            talkStEl.textContent =
              lang === "it" ? "Microfono negato" : "Mic permission denied";
            endTalk();
            return;
          }
          if (e.error === "no-speech") {
            // No speech detected in this window — treat as empty, let onend handle it
            // (onend fires right after onerror for no-speech)
            return;
          }
          if (e.error === "aborted") return; // intentional stop, ignore
          // Any other error — retry after short pause
          if (talkActive && !talkMuted && !isSpeaking) {
            setTimeout(() => startTalkListen(), 800);
          }
        };
      }

      async function toggleMic() {
        // Request permission if not done yet
        if (!micPermGranted) {
          const ok = await requestMicOnce();
          if (!ok) {
            alert(
              lang === "it"
                ? "Microfono non supportato. Usa Chrome o Edge."
                : "Voice not supported. Use Chrome or Edge.",
            );
            return;
          }
        }
        if (!chatRecog) initChatRecog();
        chatRecog.lang = l("sttLang");
        if (chatListening) {
          chatRecog.stop();
          return;
        }
        try {
          chatRecog.start();
        } catch (e) {
          chatRecog.abort();
          setTimeout(() => {
            try {
              chatRecog.start();
            } catch (e2) {}
          }, 150);
        }
      }

      // ═══════════════════════════════════════════════════════════════════
      // TALK TAB
      // ═══════════════════════════════════════════════════════════════════
      const talkAvEl = document.getElementById("talkAv"),
        talkStEl = document.getElementById("talkSt");
      const wavesEl = document.getElementById("waves"),
        transcriptEl = document.getElementById("transcript");
      const ctrlIdle = document.getElementById("ctrlIdle"),
        ctrlLive = document.getElementById("ctrlLive");
      const talkTimerEl = document.getElementById("talkTimer");

      function setTalkSt(txt, cls) {
        talkStEl.textContent = txt;
        talkStEl.className = `talk-st ${cls}`;
      }
      function showWave(show, red = false) {
        wavesEl.classList.toggle("show", show);
        wavesEl.classList.toggle("red", red);
      }
      function addTalkLine(role, text) {
        talkHistory.push({ role, text });
        const recent = talkHistory.slice(-8);
        transcriptEl.innerHTML = recent
          .map(
            (tx) =>
              `<div class="t-line ${tx.role}"><div class="t-spk">${tx.role === "bot" ? (lang === "it" ? "Assistente" : "Assistant") : lang === "it" ? "Tu" : "You"}</div><div class="t-txt">${tx.text}</div></div>`,
          )
          .join("");
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      }

      function talkSpeak(text, onDone) {
        if (!text || !window.speechSynthesis) {
          onDone?.();
          afterTalkSpeak();
          return;
        }

        // Cancel any ongoing speech or listening before speaking
        window.speechSynthesis.cancel();
        if (talkRecog && isListening) {
          try {
            talkRecog.stop();
          } catch (e) {}
        }

        const clean = cleanForSpeech(String(text));
        if (!clean || clean.length < 2) {
          onDone?.();
          afterTalkSpeak();
          return;
        }

        isSpeaking = true;
        showWave(true, false);
        setTalkSt(lang === "it" ? "Parlo..." : "Speaking...", "speaking");

        const u = new SpeechSynthesisUtterance(clean);
        u.lang = l("ttsLang");
        u.rate = 0.92;
        u.pitch = 1.0;

        // Pick best natural voice
        const vs = window.speechSynthesis.getVoices();
        let pref;
        if (lang === "it") {
          pref =
            vs.find((v) => v.name === "Google italiano") ||
            vs.find(
              (v) => v.lang.startsWith("it") && v.name.includes("Google"),
            ) ||
            vs.find((v) => v.lang.startsWith("it"));
        } else {
          pref =
            vs.find((v) => v.name === "Google UK English Female") ||
            vs.find((v) => v.name.includes("Google") && v.lang === "en-GB") ||
            vs.find(
              (v) => v.name.includes("Google") && v.lang.startsWith("en"),
            ) ||
            vs.find((v) => v.lang.startsWith("en-GB")) ||
            vs.find((v) => v.lang.startsWith("en"));
        }
        if (pref) u.voice = pref;

        u.onend = () => {
          onDone?.();
          afterTalkSpeak(); // opens mic after speaking
        };
        u.onerror = () => {
          afterTalkSpeak(); // still open mic even if TTS failed
        };

        window.speechSynthesis.speak(u);

        // Chrome bug: sometimes onend never fires if tab loses focus
        // Watchdog: if still "speaking" after text_length/10 seconds + 3s buffer, force afterTalkSpeak
        const watchdog = Math.max(4000, clean.length * 80);
        setTimeout(() => {
          if (isSpeaking) {
            isSpeaking = false;
            showWave(false);
            onDone?.();
            afterTalkSpeak();
          }
        }, watchdog);
      }
      function afterTalkSpeak() {
        isSpeaking = false;
        showWave(false);
        if (!talkActive || talkMuted) return;
        if (_waitingForRepeat) {
          // After saying "I cannot hear you", wait 1.5s then try ONE more time
          _waitingForRepeat = false;
          _listenRetries = 0;
          setTalkSt(lang === "it" ? "Ascolto..." : "Listening...", "listening");
          setTimeout(startTalkListen, 1500);
        } else {
          setTalkSt(lang === "it" ? "Ascolto..." : "Listening...", "listening");
          setTimeout(startTalkListen, 700);
        }
      }

      // ── Whisper STT via Groq ─────────────────────────────────────────
      async function transcribeWithWhisper(blob) {
        const form = new FormData();
        form.append('file', blob, 'speech.webm');
        form.append('model', 'whisper-large-v3');
        form.append('language', lang === 'it' ? 'it' : 'en');
        form.append('response_format', 'json');
        try {
          const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${GROQ_KEY}` },
            body: form
          });
          const d = await r.json();
          return (d.text || '').trim() || null;
        } catch(e) {
          console.warn('[Whisper]', e);
          return null;
        }
      }

      let _rec = null, _recActive = false, _recStream = null;

      function startTalkListen() {
        if (!talkActive || talkMuted || isSpeaking || isListening || _recActive) return;
        isListening = true;
        _recActive  = true;
        showWave(true, true);
        setTalkSt(lang === 'it' ? 'Ascolto...' : 'Listening...', 'listening');

        // Silence detection state
        let speechDetected = false, silenceStart = null, silenceLoop = null;
        let speechStart    = null;
        const ECHO_MS  = 400;   // ignore audio for first 400ms (echo gate)
        const SIL_MS   = 1800;  // stop after 1.8s silence
        const MIN_MS   = 600;   // reject clips < 600ms (noise)
        const NO_MS    = 7000;  // give up if no speech in 7s
        const MAX_MS   = 15000; // hard cap
        const openTime = Date.now();
        const chunks   = [];

        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => {
            _recStream = stream;
            const audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
            const src       = audioCtx.createMediaStreamSource(stream);
            const analyser  = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            src.connect(analyser);
            const buf = new Uint8Array(analyser.frequencyBinCount);

            function rms() {
              analyser.getByteTimeDomainData(buf);
              let s = 0;
              for(let i = 0; i < buf.length; i++) { const v = (buf[i]-128)/128; s += v*v; }
              return Math.sqrt(s/buf.length) * 255;
            }

            const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
              .find(t => { try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } }) || '';
            _rec = new MediaRecorder(stream, mimeType ? { mimeType } : {});
            _rec.ondataavailable = e => { if(e.data && e.data.size > 0) chunks.push(e.data); };

            function stopRec() {
              clearTimeout(silenceLoop);
              clearTimeout(noTimer);
              clearTimeout(hardTimer);
              try { audioCtx.close(); } catch(e) {}
              // Do NOT stop stream tracks — keep mic warm
              if(_recActive) {
                _recActive = false;
                try { _rec.stop(); } catch(e) {}
              }
            }

            _rec.onstop = async () => {
              isListening = false; showWave(false);
              if(!talkActive) return;
              const blob = new Blob(chunks, { type: _rec.mimeType || 'audio/webm' });
              if(!speechDetected || blob.size < 3000) {
                // Nothing heard — retry
                _listenRetries++;
                if(_listenRetries < MAX_RETRIES) {
                  setTimeout(() => startTalkListen(), 800);
                } else {
                  _listenRetries = 0;
                  const p = lang==='it' ? 'Non ti sento. Parla piu vicino al microfono.' : 'I cannot hear you. Please speak closer to the microphone.';
                  addTalkLine('bot', p);
                  _waitingForRepeat = true;
                  talkSpeak(p);
                }
                return;
              }
              _listenRetries = 0;
              setTalkSt(lang==='it' ? 'Elaboro...' : 'Processing...', 'thinking');
              const transcript = await transcribeWithWhisper(blob);
              if(transcript && transcript.length > 1) {
                addTalkLine('user', transcript);
                processTalkTurn(transcript);
              } else {
                // Whisper returned nothing — fall back and retry
                setTimeout(() => startTalkListen(), 600);
              }
            };

            _rec.onerror = () => {
              isListening = false; _recActive = false; showWave(false);
              setTimeout(() => startTalkListen(), 800);
            };

            function checkSilence() {
              if(!_recActive) return;
              const now = Date.now();
              if(now - openTime < ECHO_MS) { silenceLoop = setTimeout(checkSilence, 80); return; }
              const v = rms();
              if(v > 9) {
                if(!speechDetected) { speechDetected = true; speechStart = now; }
                silenceStart = null;
                talkStEl.textContent = lang==='it' ? 'Ti sento...' : 'Hearing you...';
              } else if(speechDetected && !silenceStart) {
                silenceStart = now;
              }
              if(speechDetected && silenceStart) {
                const dur = silenceStart - (speechStart || silenceStart);
                if(Date.now() - silenceStart >= SIL_MS) {
                  if(dur < MIN_MS) {
                    speechDetected = false; speechStart = null; silenceStart = null;
                    silenceLoop = setTimeout(checkSilence, 80); return;
                  }
                  stopRec(); return;
                }
              }
              silenceLoop = setTimeout(checkSilence, 80);
            }

            const noTimer   = setTimeout(() => { if(!speechDetected) stopRec(); }, NO_MS);
            const hardTimer = setTimeout(stopRec, MAX_MS);

            _rec.start(100);
            silenceLoop = setTimeout(checkSilence, 80);
          })
          .catch(e => {
            isListening = false; _recActive = false; showWave(false);
            setTalkSt(lang==='it' ? 'Microfono negato.' : 'Mic denied. Check browser settings.', 'ended');
            endTalk();
          });
      }

      async function processTalkTurn(text) {
        // Stop listening while processing
        setTalkSt(lang === "it" ? "Penso..." : "Thinking...", "thinking");
        showWave(false);

        // ── Simple direct flow for talk — no shared state with chat ──
        // Phone collection
        if (
          !S.verified &&
          (S.step === "collect_phone" || S.step === "verify_otp")
        ) {
          if (S.step === "collect_phone") {
            setTalkSt(
              lang === "it" ? "Leggo il numero..." : "Reading number...",
              "thinking",
            );
            const phone = await extractPhone(text);
            if (!phone) {
              const m =
                lang === "it"
                  ? "Non ho capito il numero. Dimmi il tuo cellulare con prefisso, per esempio più 39 612 345 678."
                  : "I did not catch your number. Please say your mobile with country code, for example plus 39 612 345 678.";
              addTalkLine("bot", m);
              talkSpeak(m);
              return;
            }
            S.phone = phone;
            try {
              const r = await api("POST", "/api/ai/en/otp-send", { phone });
              if (r.success) {
                S.otp = r.otp;
                S.otpSent = true;
                const spk = spellDigits(phone);
                const m =
                  lang === "it"
                    ? `Ho inviato un codice a ${spk}. Dimmi le sei cifre.`
                    : `I sent a code to ${spk}. Please say the six digits.`;
                addTalkLine("bot", m);
                talkSpeak(m);
                S.step = "verify_otp";
              } else {
                const m =
                  lang === "it"
                    ? "Numero non valido. Riprova."
                    : "Invalid number. Please try again.";
                addTalkLine("bot", m);
                talkSpeak(m);
              }
            } catch (e) {
              const m = "Network error. Try again.";
              addTalkLine("bot", m);
              talkSpeak(m);
            }
            return;
          }
          if (S.step === "verify_otp") {
            // Check if user wants resend
            const lower = text.toLowerCase();
            if (
              lower.includes("resend") ||
              lower.includes("again") ||
              lower.includes("new code") ||
              lower.includes("did not receive") ||
              lower.includes("reinvia") ||
              lower.includes("nuovo codice")
            ) {
              await doResendOTP();
              const r = S.otp ? "New code sent." : "Could not resend.";
              addTalkLine("bot", r);
              talkSpeak(r);
              return;
            }
            setTalkSt(
              lang === "it" ? "Leggo il codice..." : "Reading code...",
              "thinking",
            );
            const code = await extractOTP(text);
            if (!code) {
              const m =
                lang === "it"
                  ? "Non ho sentito il codice. Dimmi le sei cifre lentamente."
                  : "I did not catch the code. Please say the six digits slowly.";
              addTalkLine("bot", m);
              talkSpeak(m);
              return;
            }
            try {
              const r = await api("POST", "/api/ai/en/otp-verify", {
                otp: code,
              });
              if (r.success) {
                S.userId = r.user?.user_id;
                S.userEmail = r.user?.email || "";
                S.phone = r.user?.phone || S.phone;
                S.verified = true;
                await loadData();
                const m =
                  lang === "it"
                    ? `Identità verificata! Come ti chiami?`
                    : "Identity verified! What's your first name?";
                addTalkLine("bot", m);
                talkSpeak(m);
                S.step = "collect_name";
              } else {
                S.otpAttempts++;
                const m =
                  S.otpAttempts >= 3
                    ? lang === "it"
                      ? "Troppi tentativi. Ricarica la pagina."
                      : "Too many attempts. Please refresh."
                    : lang === "it"
                      ? `Codice errato. ${3 - S.otpAttempts} tentativo rimanente.`
                      : `Wrong code. ${3 - S.otpAttempts} attempt(s) left.`;
                addTalkLine("bot", m);
                talkSpeak(m);
              }
            } catch (e) {
              const m = `Verification error.`;
              addTalkLine("bot", m);
              talkSpeak(m);
            }
            return;
          }
        }

        // Name collection
        if (S.step === "collect_name") {
          S.userName = text.trim().split(" ")[0];
          const m =
            lang === "it"
              ? `Piacere ${S.userName}! Qual è il tuo cognome?`
              : `Nice to meet you ${S.userName}! What's your last name?`;
          addTalkLine("bot", m);
          talkSpeak(m);
          S.step = "collect_last";
          return;
        }
        if (S.step === "collect_last") {
          S.userLastName = text.trim();
          enterFreeMode();
          const m = lang==='it'
            ? `Benvenuto ${S.userName} ${S.userLastName}! Come posso aiutarti? Posso prenotare un appuntamento, mostrarti i tuoi appuntamenti, o darti informazioni sui nostri dottori.`
            : `Welcome ${S.userName} ${S.userLastName}! How can I help you? I can book an appointment, show your appointments, or tell you about our doctors.`;
          addTalkLine('bot', m);
          talkSpeak(m);
          S.step = 'idle';
          return;
        }

        // Booking sub-steps
        if (S.step === "booking_for") {
          const who = await extractForWho(text);
          if (who === "other") {
            S.forOther = true;
            const m = lang==='it'
              ? `Capito! Dimmi il nome del paziente.`
              : `Got it! Please tell me the patient's first name.`;
            addTalkLine('bot', m); talkSpeak(m);
            S.step = 'collect_patient_name';
          } else if (who === "self") {
            S.forOther = false;
            const m = lang==='it'
              ? `Perfetto! Ora cerchiamo il dottore giusto per te.`
              : `Great! Now let us find the right doctor for you.`;
            addTalkLine('bot', m);
            talkSpeak(m, async () => { await talkStartFindBy(); });
          } else {
            // unclear — ask again simply
            const m = lang==='it'
              ? `Scusa, non ho capito. Di' semplicemente "per me" o "per qualcun altro".`
              : `Sorry, I did not catch that. Just say "for me" or "for someone else".`;
            addTalkLine('bot', m); talkSpeak(m);
            // stay on booking_for step
          }
          return;
        }
        if (S.step === "collect_patient_name") {
          S.patName = text.trim();
          const m = lang==='it'
            ? `Grazie. E il cognome del paziente?`
            : `Thank you. And the patient's last name?`;
          addTalkLine('bot', m); talkSpeak(m);
          S.step = 'collect_patient_last';
          return;
        }
        if (S.step === "collect_patient_last") {
          S.patLast = text.trim();
          const m = lang==='it'
            ? `Perfetto. Hai il numero di telefono del paziente?`
            : `Perfect. Do you have the patient's phone number?`;
          addTalkLine('bot', m); talkSpeak(m);
          S.step = 'collect_patient_phone';
          return;
        }
        if (S.step === "collect_patient_phone") {
          const p = await extractPhone(text);
          S.patPhone = p || text.trim();
          const m = lang==='it'
            ? `Perfetto. Ora cerchiamo il dottore per ${S.patName}.`
            : `Perfect. Now let us find a doctor for ${S.patName}.`;
          addTalkLine('bot', m);
          talkSpeak(m, async () => { await talkStartFindBy(); });
          return;
        }

        if (S.step === "find_by" || S.step === "match_doctor") {
          setTalkSt(lang === "it" ? "Cerco..." : "Matching...", "thinking");
          const match = await matchDoctorOrSpec(text);
          if (match) {
            await talkConfirmMatch(match);
          } else {
            const m =
              lang === "it"
                ? "Non ho trovato una corrispondenza. Puoi descrivere il tipo di dottore che cerchi?"
                : "I could not find a match. Can you describe the type of doctor you need?";
            addTalkLine("bot", m);
            talkSpeak(m);
            S.step = "match_doctor";
          }
          return;
        }

        if (S.step === "confirm_doctor") {
          const ans = await extractConfirm(text);
          if (ans === "yes") {
            await talkAskDate();
          } else if (ans === "no") {
            await talkStartFindBy();
          } else {
            const m = lang === "it" ? "Sì o no?" : "Yes or no?";
            addTalkLine("bot", m);
            talkSpeak(m);
          }
          return;
        }

        if (S.step === "collect_date") {
          const ds = await extractDate(text);
          if (ds) {
            S.prefDate = ds;
            await talkLoadSlots(ds);
          } else {
            const m =
              lang === "it"
                ? 'Non ho capito la data. Prova con "prossimo lunedì" o "il prima possibile".'
                : 'Did not catch the date. Try "next Monday" or "as soon as possible".';
            addTalkLine("bot", m);
            talkSpeak(m);
          }
          return;
        }

        if (S.step === "select_slot") {
          // First: try to match a spoken time against available slots
          const matchedSlot = await extractSpokenTime(text, S.slotOpts || []);
          if(matchedSlot) {
            S.slotId   = matchedSlot.id;
            S.slotDate = matchedSlot.date;
            S.slotTime = matchedSlot.time;
            await talkConfirmSlot(matchedSlot);
            return;
          }
          // Second: try date change
          const ds = await extractDate(text);
          if (ds) {
            S.prefDate = ds;
            await talkLoadSlots(ds);
          } else {
            // Could be "the first one", "morning", "afternoon" etc.
            const slot = extractSlotByKeyword(text, S.slotOpts || []);
            if(slot){
              S.slotId   = slot.id;
              S.slotDate = slot.date;
              S.slotTime = slot.time;
              await talkConfirmSlot(slot);
            } else {
              const m = lang==="it"
                ? `Non ho capito. Dimmi un orario come "le 9 di mattina" oppure "il pomeriggio", o un altro giorno.`
                : `I did not catch that. Say a time like "9 in the morning" or "afternoon", or tell me another day.`;
              addTalkLine("bot", m);
              talkSpeak(m);
            }
          }
          return;
        }

        if (S.step === "confirm_booking") {
          const ans = await extractConfirm(text);
          if (ans === "yes") {
            await talkDoBook();
          } else if (ans === "no") {
            S.step = "idle";
            const m =
              lang === "it" ? "Prenotazione annullata." : `Booking cancelled.`;
            addTalkLine("bot", m);
            talkSpeak(m);
          } else {
            const m =
              lang === "it" ? "Confermi? Sì o no." : `Confirm? Yes or no.`;
            addTalkLine("bot", m);
            talkSpeak(m);
          }
          return;
        }

        // ── Free mode — use AI agent ──────────────────────────────────
        setTalkSt(lang === "it" ? "Penso..." : "Thinking...", "thinking");
        const ctx = talkHistory
          .slice(-8)
          .map((h) => `${h.role === "bot" ? "Assistant" : "User"}: ${h.text}`)
          .join("\n");
        const state = `User: ${S.userName || "unknown"} ${S.userLastName || ""}, verified: ${S.verified}, appts: ${S.appts.length}`;
        const decision = await agentDecide(text, `${state}\n${ctx}`);
        const reply =
          decision.speak_reply || decision.reply || "I am here to help.";
        addTalkLine("bot", reply);

        if (decision.action === "resend_otp") {
          talkSpeak(reply, async () => {
            await doResendOTP();
          });
        } else if (decision.action === "filter_doctors") {
          talkSpeak(reply, async () => {
            await talkFilterDoctors(decision.filter_category || text);
          });
        } else if (decision.action === "show_doctors") {
          talkSpeak(reply, async () => {
            await talkShowDoctors();
          });
        } else if (
          decision.action === "show_appointments" ||
          decision.action === "show_appointments_cancel"
        ) {
          talkSpeak(reply, async () => {
            await talkShowAppts();
          });
        } else if (decision.action === "start_booking") {
          // Always ask "for who" before searching for doctor
          const forWhoPrompt = lang==='it'
            ? `Certo, prenotiamo un appuntamento! È per te o per qualcun altro?`
            : `Sure, let us book an appointment! Is this for you or for someone else?`;
          addTalkLine('bot', forWhoPrompt);
          talkSpeak(forWhoPrompt);
          S.step = 'booking_for';
        } else if (decision.action === "end") {
          talkSpeak(reply, () => setTimeout(endTalk, 1000));
        } else talkSpeak(reply);
      }

      // Extract spoken time and match to a slot
      async function extractSpokenTime(text, slots) {
        if(!slots.length) return null;
        const slotList = slots.slice(0,8).map((s,i) => `${i+1}. slot_id:${s.id} time:${s.time} date:${s.date}`).join('\n');
        const sys = `User said a time preference. Match to one of these slots.
Slots:\n${slotList}
Rules:
- "morning" / "mattina" / "9" / "9 o'clock" → earliest morning slot
- "afternoon" / "pomeriggio" / "2" / "14" → earliest afternoon slot
- "evening" / "sera" / "17" / "18" → latest slot
- "first" / "primo" / "the first one" → slot 1
- exact time like "9:30" or "14:00" → closest matching slot
Return ONLY the slot_id number or NONE.`;
        const r = await groq(M.nlp, sys, text, 15);
        if(!r || r==='NONE') return null;
        const id = parseInt(r.trim());
        return slots.find(s => s.id === id) || null;
      }

      // Keyword-based slot matching (fast, no LLM)
      function extractSlotByKeyword(text, slots) {
        if(!slots.length) return null;
        const t = text.toLowerCase();
        const morning = slots.filter(s => s.time < '12:00:00');
        const aftn    = slots.filter(s => s.time >= '12:00:00' && s.time < '17:00:00');
        const evening = slots.filter(s => s.time >= '17:00:00');
        if(/morning|mattina|presto|early|first/i.test(t)) return morning[0] || slots[0];
        if(/afternoon|pomeriggio|lunch|pranzo/i.test(t)) return aftn[0] || null;
        if(/evening|sera|late|tardi/i.test(t)) return evening[0] || aftn[aftn.length-1] || null;
        if(/first|primo|prima|uno|1/i.test(t)) return slots[0];
        if(/second|secondo|due|2/i.test(t)) return slots[1] || slots[0];
        if(/third|terzo|tre|3/i.test(t)) return slots[2] || slots[0];
        return null;
      }

      // Show confirmation of chosen slot before booking
      async function talkConfirmSlot(slot) {
        function verbalTime2(t) {
          const [hh, mm] = t.substring(0,5).split(':').map(Number);
          const period = hh < 12 ? (lang==='it'?'di mattina':'in the morning')
                       : hh < 17 ? (lang==='it'?'del pomeriggio':'in the afternoon')
                       : (lang==='it'?'di sera':'in the evening');
          const h12 = hh > 12 ? hh - 12 : hh === 0 ? 12 : hh;
          if(mm===0) return lang==='it' ? `le ${hh} ${period}` : `${h12} ${period}`;
          return lang==='it' ? `le ${hh} e ${mm} ${period}` : `${h12} ${mm} ${period}`;
        }
        const timeVerbal = verbalTime2(slot.time);
        const dateVerbal = fmtDate(slot.date);
        const m = lang==='it'
          ? `Perfetto. Ho selezionato ${dateVerbal} ${timeVerbal} con ${S.docName}. Confermo la prenotazione?`
          : `Great. I have selected ${dateVerbal} ${timeVerbal} with ${S.docName}. Shall I confirm the booking?`;
        addTalkLine('bot', m);
        talkSpeak(m);
        S.step = 'confirm_booking';
      }

      async function talkLoadSlots(ds) {
        setTalkSt(
          lang === "it" ? "Cerco disponibilità..." : "Finding slots...",
          "thinking",
        );
        try {
          const data = await api("POST", "/api/ai/en/calendars", {
            find_by: S.findBy,
            doctor_user_id: S.docId,
            specialization_id: String(S.specId),
          });
          const rows = data["0"].slot_rows,
            dates = Object.keys(rows).sort();
          const opts = [];
          let used = null;
          if (rows[ds]?.length > 0) {
            used = ds;
            rows[ds].forEach((s) =>
              opts.push({ id: s.slot_id, date: ds, time: s.slot_time }),
            );
          } else {
            for (const d of dates) {
              if (d <= ds) continue;
              if (rows[d]?.length > 0) {
                used = d;
                rows[d].forEach((s) =>
                  opts.push({ id: s.slot_id, date: d, time: s.slot_time }),
                );
                break;
              }
            }
          }
          if (!opts.length) {
            const m =
              lang === "it"
                ? `Nessuno slot disponibile. Prova un'altra data.`
                : `No slots available. Try another date.`;
            addTalkLine("bot", m);
            talkSpeak(m);
            S.step = "collect_date";
            return;
          }
          S.slotOpts = opts;
          // Pick up to 3 sample slots spread across the day for verbal presentation
          const morning = opts.filter((o) => o.time < "12:00:00").slice(0, 2);
          const aftn    = opts.filter((o) => o.time >= "12:00:00" && o.time < "17:00:00").slice(0, 1);
          const sample  = [...morning, ...aftn].slice(0, 3);
          if(!sample.length) sample.push(opts[0]); // fallback
          // Store first as default in case user just says "yes" or "first one"
          S.slotId   = sample[0].id;
          S.slotDate = sample[0].date;
          S.slotTime = sample[0].time;
          // Build verbal time descriptions — NO numbers that sound like currency
          function verbalTime(t) {
            const [hh, mm] = t.substring(0,5).split(':').map(Number);
            const period = hh < 12 ? (lang==='it'?'di mattina':'in the morning')
                         : hh < 17 ? (lang==='it'?'del pomeriggio':'in the afternoon')
                         : (lang==='it'?'di sera':'in the evening');
            const h12   = hh > 12 ? hh - 12 : hh === 0 ? 12 : hh;
            if(mm === 0) return lang==='it' ? `le ${hh} ${period}` : `${h12} ${period}`;
            return lang==='it' ? `le ${hh} e ${mm} ${period}` : `${h12} ${mm} ${period}`;
          }
          const dateLabel   = fmtDate(used);
          const timeSamples = sample.map((s) => verbalTime(s.time)).join(lang==='it'?' oppure ':' or ');
          const prefix = used !== ds
            ? (lang==='it' ? `Non ho slot per quella data, ma ho disponibilità il ${dateLabel}. ` : `No slots on your date but I have availability on ${dateLabel}. `)
            : '';
          const m = lang==='it'
            ? `${prefix}Ho questi orari disponibili: ${timeSamples}. Quale preferisci? Puoi anche chiedermi un altro giorno.`
            : `${prefix}I have these times available: ${timeSamples}. Which one would you like? You can also ask for a different day.`;
          addTalkLine("bot", m);
          talkSpeak(m);
          S.step = "select_slot";
          // Also show full slot grid in chat tab
          addMsg(buildSlotsHtml(opts, used), "bot", true);
        } catch (e) {
          const m = "Error loading calendar.";
          addTalkLine("bot", m);
          talkSpeak(m);
        }
      }

      function buildSlotsHtml(opts, used) {
        const morning = opts.filter((o) => o.time < "12:00:00"),
          aftn = opts.filter((o) => o.time >= "12:00:00");
        const dl = fmtDate(used);
        let html = `<div class="slots-hdr">📅 ${used} · ${dl}</div>`;
        if (morning.length) {
          html += `<div class="period-lbl">${lang === "it" ? "🌅 Mattina" : "🌅 Morning"}</div><div class="slots-grid">`;
          morning.forEach((o) => {
            html += `<button class="slot-chip" data-slot-id="${o.id}" data-date="${o.date}" data-time="${o.time}">🕐 ${o.time.substring(0, 5)}</button>`;
          });
          html += `</div>`;
        }
        if (aftn.length) {
          html += `<div class="period-lbl">${lang === "it" ? "🌆 Pomeriggio" : "🌆 Afternoon"}</div><div class="slots-grid">`;
          aftn.forEach((o) => {
            html += `<button class="slot-chip" data-slot-id="${o.id}" data-date="${o.date}" data-time="${o.time}">🕐 ${o.time.substring(0, 5)}</button>`;
          });
          html += `</div>`;
        }
        return html;
      }

          .map((d) => `${d.doctor_title} ${d.doctor_last_name}`)
          .join(", ");
        if (match?.type === "spec") {
          const sp = S.specs.find((s) => s.spec_id === match.id);
          if (sp) {
            names = S.doctors
              .map(
                (d) =>
                  `${d.doctor_title} ${d.doctor_first_name} ${d.doctor_last_name}`,
              )
              .slice(0, 5)
              .join(", ");
          }
        }
        const m =
          lang === "it"
            ? `I nostri dottori includono: ${names}. Vuoi prenotare con uno di loro?`
            : `Our doctors include: ${names}. Would you like to book with one of them?`;
        addTalkLine("bot", m);
        talkSpeak(m);
        addMsg(buildDoctorsList(), "bot", true);
      }

      async function talkShowDoctors() {
        if (!S.doctors.length) {
          try {
            const d = await api("GET", "/api/ai/en/doctors");
            S.doctors = d.doctors;
            S.specs = d.specializations;
          } catch (e) {}
        }
        const names = S.doctors
          .slice(0, 4)
          .map((d) => `${d.doctor_title} ${d.doctor_last_name}`)
          .join(", ");
        const m =
          lang === "it"
            ? `Abbiamo ${S.doctors.length} dottori, tra cui ${names}.`
            : `We have ${S.doctors.length} doctors including ${names}.`;
        addTalkLine("bot", m);
        talkSpeak(m);
        addMsg(buildDoctorsList(), "bot", true);
      }

      function buildDoctorsList() {
        return `<div class="info-title">${lang === "it" ? `👨‍⚕️ Dottori (${S.doctors.length})` : `👨‍⚕️ Doctors (${S.doctors.length})`}</div><div class="info-list">${S.doctors.map((d) => `<div class="info-item">${d.doctor_title} ${d.doctor_first_name} ${d.doctor_last_name}</div>`).join("")}</div>`;
      }

      // Handle user selecting a slot verbally in talk mode
      // Override onend to also check if user said a time like "9 o'clock"
      const _origSelectSlot = window.pickSlot;

      async function startTalk() {
        if (location.protocol === "file:") {
          setTalkSt(
            "⚠️ Serve localhost — run: python -m http.server 8080",
            "ended",
          );
          const el = document.getElementById("talkSt");
          el.style.fontSize = "11px";
          el.style.textAlign = "center";
          el.style.padding = "0 20px";
          return;
        }
        const ok = await requestMicOnce();
        if (!ok) {
          setTalkSt(
            lang === "it"
              ? "Microfono negato. Clicca sul lucchetto nella barra del browser e consenti il microfono."
              : "Mic denied. Click the lock icon in the browser bar and allow microphone access.",
            "ended",
          );
          document.getElementById("talkSt").style.fontSize = "11px";
          return;
        }
        initTalkRecog();
        talkActive = true;
        talkHistory = [];
        transcriptEl.innerHTML = "";
        ctrlIdle.style.display = "none";
        ctrlLive.style.display = "flex";
        talkTimerEl.style.display = "block";
        talkSecs = 0;
        talkTimerInt = setInterval(() => {
          talkSecs++;
          talkTimerEl.textContent = `${String(Math.floor(talkSecs / 60)).padStart(2, "0")}:${String(talkSecs % 60).padStart(2, "0")}`;
        }, 1000);
        talkAvEl.classList.add("ring");
        setTalkSt(l("connecting"), "connecting");
        window.speechSynthesis.onvoiceschanged = () => {};
        talkAvEl.classList.remove("ring");
        setTalkSt(l("connected"), "live");

        // Speak greeting then wait for user — voices must be loaded first
        function doGreet() {
          const greet = S.userName
            ? lang === "it"
              ? `Ciao ${S.userName}! Come posso aiutarti oggi?`
              : `Hello ${S.userName}! How can I help you today?`
            : lang === "it"
              ? "Benvenuto alla NCM. Sono il tuo assistente medico. Dimmi il tuo numero di cellulare con prefisso, per esempio più 39 seguito dalle cifre."
              : "Welcome to NCM. I am your medical assistant. Please say your mobile phone number with country code, for example plus 39 then your number.";
          addTalkLine("bot", greet);
          talkSpeak(greet); // after speaking, afterTalkSpeak → startTalkListen automatically
        }

        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          setTimeout(doGreet, 600);
        } else {
          // Chrome loads voices async
          window.speechSynthesis.onvoiceschanged = () => {
            setTimeout(doGreet, 600);
          };
          setTimeout(doGreet, 2500); // hard fallback
        }
      }

      function endTalk() {
        talkActive = false;
        try {
          if (talkRecog && isListening) talkRecog.stop();
        } catch (e) {}
        window.speechSynthesis.cancel();
        clearInterval(talkTimerInt);
        isListening = false;
        isSpeaking = false;
        _listenRetries = 0;
        showWave(false);
        const dur = talkTimerEl.textContent;
        ctrlIdle.style.display = "flex";
        ctrlLive.style.display = "none";
        talkTimerEl.style.display = "none";
        addTalkLine(
          "bot",
          lang === "it"
            ? `Chiamata terminata. Durata: ${dur}`
            : `Talk ended. Duration: ${dur}`,
        );
        setTalkSt(`${lang === "it" ? "Terminato" : "Ended"} · ${dur}`, "ended");
      }

      function toggleMute() {
        talkMuted = !talkMuted;
        document.getElementById("muteBtn").textContent = talkMuted
          ? "🔇"
          : "🎙️";
        document.getElementById("muteBtn").classList.toggle("muted", talkMuted);
        document.getElementById("muteLbl").textContent = talkMuted
          ? l("unmuteLbl")
          : l("muteLbl");
        if (talkMuted) {
          talkRecog?.stop();
          window.speechSynthesis.cancel();
          showWave(false);
          setTalkSt(l("muted"), "idle");
        } else startTalkListen();
      }

      function toggleSpk() {
        spkOn = !spkOn;
        document.getElementById("spkBtn").textContent = spkOn ? "🔊" : "🔈";
        document.getElementById("spkBtn").classList.toggle("spk-off", !spkOn);
        document.getElementById("spkLbl").textContent = spkOn
          ? l("spkLbl")
          : l("spkOffLbl");
        if (!spkOn) window.speechSynthesis.cancel();
      }

      function switchTab(tab) {
        document
          .getElementById("chatPane")
          .classList.toggle("hidden", tab === "talk");
        document
          .getElementById("talkPane")
          .classList.toggle("show", tab === "talk");
        document
          .getElementById("tabChat")
          .classList.toggle("active", tab === "chat");
        document
          .getElementById("tabTalk")
          .classList.toggle("active", tab === "talk");
      }

      // ── Send ─────────────────────────────────────────────────────────
      function doSend() {
        const tx = inp.value.trim();
        if (!tx || inp.disabled) return;
        inp.value = "";
        handleInput(tx);
      }
      document.getElementById("sendBtn").onclick = doSend;
      inp.onkeydown = (e) => {
        if (e.key === "Enter") doSend();
      };

      // Enter free mode after lastname collected
      const _origHandleInput = handleInput;
      window.handleInput = async function (text) {
        await _origHandleInput(text);
        if (!S.freeMode && S.verified && S.userName && S.userLastName)
          enterFreeMode();
      };

      // Request mic permission on first click anywhere (not repeatedly)
      document.addEventListener(
        "click",
        () => {
          if (!micPermGranted) requestMicOnce();
        },
        { once: true },
      );

      window.speechSynthesis.onvoiceschanged = () =>
        window.speechSynthesis.getVoices();
      setEnabled(false);
      start();
    </script>
  </body>
</html>
